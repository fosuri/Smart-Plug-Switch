<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- White line icon: 410x410 centered (margin 51px), mirror axis x=256 -->

  <!-- Socket face outline (stroke inset so outer edge sits exactly on the 410px bounds) -->
  <rect x="63" y="63" width="386" height="386" rx="116" fill="none" stroke="#FFFFFF" stroke-width="24"/>

  <!-- Wi-Fi -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
    <path d="M236.2 150.2 A28 28 0 0 1 275.8 150.2"/>
    <path d="M219.2 133.2 A52 52 0 0 1 292.8 133.2"/>
  </g>
  <circle cx="256" cy="170" r="9" fill="#FFFFFF"/>

  <!-- EU socket holes -->
  <circle cx="194" cy="256" r="28" fill="#FFFFFF"/>
  <circle cx="318" cy="256" r="28" fill="#FFFFFF"/>

  <!-- Power symbol -->
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
    <path d="M230 340.1 A34 34 0 1 0 282 340.1"/>
    <path d="M256 322 V354"/>
  </g>
</svg>
